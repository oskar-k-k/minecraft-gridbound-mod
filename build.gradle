plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'de.orbitcraft'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.219'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { gridbound { sourceSet(sourceSets.main) } }
    addModdingDependenciesTo sourceSets.test
}
repositories { mavenCentral(); maven { url = 'https://maven.ftb.dev/releases' }; maven { url = 'https://maven.architectury.dev' } }
dependencies {
    implementation 'dev.ftb.mods:ftb-quests-neoforge:2101.1.36'
    implementation 'dev.ftb.mods:ftb-library-neoforge:2101.1.37'
    implementation 'dev.ftb.mods:ftb-teams-neoforge:2101.1.11'
    implementation 'dev.architectury:architectury-neoforge:13.0.11'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
